<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>Sena Pinheiro — Elétrica e Climatização</title>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10151a"/><stop offset=".55" stop-color="#252b31"/><stop offset="1" stop-color="#090d11"/></linearGradient>
 <linearGradient id="metal" x2="1" y2="1"><stop stop-color="#59616a"/><stop offset=".22" stop-color="#252c33"/><stop offset=".6" stop-color="#11171d"/><stop offset="1" stop-color="#414951"/></linearGradient>
 <linearGradient id="gold" x2="0" y2="1"><stop stop-color="#f1ce70"/><stop offset="1" stop-color="#9c6b12"/></linearGradient>
 <linearGradient id="glass" x2="1" y2="1"><stop stop-color="#263b48"/><stop offset=".5" stop-color="#101a22"/><stop offset="1" stop-color="#35434b"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="24"/></filter>
 <linearGradient id="editorialShade" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#090d11" stop-opacity=".98"/><stop offset=".34" stop-color="#090d11" stop-opacity=".78"/><stop offset=".63" stop-color="#090d11" stop-opacity=".12"/><stop offset="1" stop-color="#090d11" stop-opacity=".04"/></linearGradient>
 <radialGradient id="spotlight"><stop stop-color="#f0c96a" stop-opacity=".24"/><stop offset="1" stop-color="#f0c96a" stop-opacity="0"/></radialGradient>
 <linearGradient id="edgeLight" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff" stop-opacity=".13"/><stop offset=".18" stop-color="#ffffff" stop-opacity="0"/><stop offset=".82" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity=".48"/></linearGradient>
 <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="46"/></filter>
 <pattern id="perfs" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.5" fill="#89919a" opacity=".28"/></pattern>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<ellipse cx="1050" cy="470" rx="600" ry="420" fill="#b8860b" opacity=".12" filter="url(#shadow)"/>
<!-- technical cabinet, cropped close-up -->
<g transform="translate(420,-60) rotate(-3 650 480)">
 <rect x="115" y="80" width="1010" height="850" rx="24" fill="#05080b" opacity=".8" filter="url(#shadow)"/>
 <rect x="90" y="55" width="1010" height="850" rx="18" fill="url(#metal)" stroke="#79818a" stroke-opacity=".45" stroke-width="3"/>
 <rect x="115" y="82" width="960" height="796" rx="10" fill="#111820" stroke="#070b0f" stroke-width="8"/>
 <rect x="135" y="102" width="920" height="756" fill="url(#perfs)" opacity=".7"/>
 <!-- left distribution rail -->
 <rect x="175" y="145" width="270" height="655" rx="10" fill="#1c252d" stroke="#64707a" stroke-width="2"/>
 <rect x="194" y="164" width="232" height="70" rx="5" fill="#303a42"/>
 <text x="310" y="208" text-anchor="middle" fill="#d7dce0" font-family="Arial,sans-serif" font-size="20" letter-spacing="4">DISTRIBUIÇÃO</text>
 <g>
  <rect x="205" y="258" width="54" height="185" rx="6" fill="#080d12" stroke="#77818a" stroke-width="2"/>
  <rect x="269" y="258" width="54" height="185" rx="6" fill="#080d12" stroke="#77818a" stroke-width="2"/>
  <rect x="333" y="258" width="54" height="185" rx="6" fill="#080d12" stroke="#77818a" stroke-width="2"/>
 </g>
 <g fill="#343e47" stroke="#929ba3" stroke-width="2">
  <rect x="215" y="274" width="34" height="58" rx="4"/><rect x="279" y="274" width="34" height="58" rx="4"/><rect x="343" y="274" width="34" height="58" rx="4"/>
  <rect x="215" y="346" width="34" height="76" rx="4"/><rect x="279" y="346" width="34" height="76" rx="4"/><rect x="343" y="346" width="34" height="76" rx="4"/>
 </g>
 <g fill="url(#gold)"><rect x="226" y="285" width="12" height="31" rx="3"/><rect x="290" y="285" width="12" height="31" rx="3"/><rect x="354" y="285" width="12" height="31" rx="3"/></g>
 <g stroke="#b8860b" stroke-width="8" fill="none" opacity=".9"><path d="M232 430 V535 H390 V615"/><path d="M296 430 V510 H360 V615"/><path d="M360 430 V480 H330 V615"/></g>
 <!-- central controller -->
 <rect x="480" y="145" width="330" height="345" rx="12" fill="#0b1117" stroke="#6b747c" stroke-width="3"/>
 <rect x="505" y="170" width="280" height="130" rx="7" fill="url(#glass)" stroke="#9aa6ae" stroke-opacity=".5"/>
 <rect x="530" y="194" width="230" height="82" rx="4" fill="#101e27"/>
 <path d="M548 248 L590 230 L630 241 L670 208 L738 224" stroke="#d6ad4e" stroke-width="4" fill="none"/>
 <g fill="#d7e0e3"><circle cx="548" cy="248" r="5"/><circle cx="590" cy="230" r="5"/><circle cx="630" cy="241" r="5"/><circle cx="670" cy="208" r="5"/></g>
 <g fill="#9da7ae"><circle cx="530" cy="335" r="10"/><circle cx="574" cy="335" r="10"/><circle cx="618" cy="335" r="10"/></g>
 <g fill="#b8860b"><circle cx="706" cy="335" r="10"/><circle cx="750" cy="335" r="10"/></g>
 <rect x="525" y="380" width="238" height="72" rx="5" fill="#202a32"/>
 <g stroke="#a8b0b7" stroke-width="3"><path d="M548 398h190M548 414h190M548 430h140"/></g>
 <!-- right copper bus bars and wiring -->
 <rect x="845" y="145" width="190" height="655" rx="8" fill="#172129" stroke="#69747d" stroke-width="2"/>
 <g fill="none" stroke-linecap="round">
  <path d="M890 170 V610 Q890 680 960 680 H1000" stroke="#c27b36" stroke-width="18"/>
  <path d="M945 170 V565 Q945 635 1000 635" stroke="#d8b15a" stroke-width="13"/>
  <path d="M995 170 V520 Q995 585 1020 585" stroke="#a84e3d" stroke-width="12"/>
  <path d="M870 735 H940 Q980 735 980 785" stroke="#b8860b" stroke-width="10"/>
 </g>
 <g fill="#c6a15a"><circle cx="890" cy="170" r="13"/><circle cx="945" cy="170" r="11"/><circle cx="995" cy="170" r="10"/></g>
 <g fill="#818b94"><circle cx="155" cy="120" r="7"/><circle cx="1035" cy="120" r="7"/><circle cx="155" cy="835" r="7"/><circle cx="1035" cy="835" r="7"/></g>
</g>
<ellipse cx="1120" cy="390" rx="530" ry="390" fill="url(#spotlight)"/>
<!-- editorial lighting and depth -->
<path d="M520 0H1600V900H520Z" fill="url(#edgeLight)" opacity=".8"/>
<rect width="1600" height="900" fill="url(#editorialShade)"/>
<path d="M0 0H1600" stroke="#e4bd62" stroke-opacity=".72" stroke-width="3"/>
<path d="M0 896H1600" stroke="#e4bd62" stroke-opacity=".22" stroke-width="2"/>
<!-- subtle refrigeration coil motif in the far background -->
<g opacity=".24" fill="none" stroke="#aeb8bf" stroke-width="5">
 <path d="M1310 90h110v75h-110v75h110v75h-110v75h110v75h-110"/>
 <path d="M1450 90v450"/>
</g>
<rect x="0" y="0" width="1600" height="900" fill="none" stroke="#b8860b" stroke-opacity=".35" stroke-width="3"/>
<!-- restrained brand signature -->
<g transform="translate(82 735)">
 <text x="0" y="-270" fill="#d7b766" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5">IDENTIDADE VISUAL  /  WEBSITE</text>
 <rect x="0" y="-242" width="64" height="3" fill="url(#gold)"/>
 <text x="0" y="-160" fill="#f3f0e8" font-family="Montserrat,Arial,sans-serif" font-size="55" font-weight="700" letter-spacing="-1">Energia,</text>
 <text x="0" y="-98" fill="#f3f0e8" font-family="Montserrat,Arial,sans-serif" font-size="55" font-weight="700" letter-spacing="-1">controle e</text>
 <text x="0" y="-36" fill="#d7b766" font-family="Montserrat,Arial,sans-serif" font-size="55" font-weight="700" letter-spacing="-1">precisão.</text>
 <text x="0" y="12" fill="#aeb5bb" font-family="Arial,sans-serif" font-size="17" letter-spacing="1.5">ELÉTRICA  •  CLIMATIZAÇÃO</text>
 <rect x="0" y="54" width="5" height="70" fill="url(#gold)"/>
 <text x="24" y="83" fill="#f1eee6" font-family="Montserrat,Arial,sans-serif" font-size="26" font-weight="700" letter-spacing="1">SENA PINHEIRO</text>
 <text x="24" y="111" fill="#c7a65c" font-family="Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="3">TERESINA  •  PI</text>
</g>
</svg>